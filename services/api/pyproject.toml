[project]
name = "alphora-api"
version = "0.1.0"
description = "Alphora research desk API — FastAPI + Postgres + Redis"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.30.0",
  "alembic>=1.13.3",
  "structlog>=24.4.0",
  "redis>=5.1.0",
  "rq>=1.16.2",
  "httpx>=0.27.2",
  "python-multipart>=0.0.12",
  "cryptography>=43.0.1",
]

[project.scripts]
alphora-worker = "app.workers.worker:main"
alphora-paper-scheduler = "app.workers.paper_scheduler:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.9",
  "mypy>=1.11.2",
  "aiosqlite>=0.20.0",
  "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
